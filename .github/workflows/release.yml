name: Publish PET CT SHEET Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application and PowerShell syntax
        shell: pwsh
        run: |
          $required = @('index.html','Server.ps1','START_SERVER.bat','ENABLE_AUTOSTART.bat','DAILY_BACKUP.ps1','DAILY_BACKUP.bat','INSTALL_AUTOSTART.ps1','RUN_SERVER_LOGGED.ps1','DIAGNOSE_SERVER.bat','FIX_SERVER_PERMISSION.ps1','FIX_SERVER_PERMISSION.bat','FIX_FIREWALL_AND_LAN.bat','CHECK_LAN_CONFIG.ps1','Watchdog.ps1')
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing source: $f" } }
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $($_.Name): $($errors | Out-String)" }
          }
      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path PET_CT_SHEET | Out-Null
          Copy-Item index.html,*.ps1,*.bat PET_CT_SHEET/
          foreach ($dir in @('Data','Backups','Logs')) { New-Item -ItemType Directory -Force -Path "PET_CT_SHEET/$dir" | Out-Null }
          Set-Content -Encoding UTF8 -Path PET_CT_SHEET/Data/bookings.json -Value '[]'
          Set-Content -Encoding UTF8 -Path PET_CT_SHEET/Data/settings.json -Value '{}'
          Compress-Archive -Path PET_CT_SHEET -DestinationPath PET_CT_SHEET_Portable_v2.9.3.zip -Force
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v2.9.3'
          $notes = @'
          PET CT SHEET v2.9.3 - Portable Windows package.

          - Fix local server startup after missing Windows HTTP URL reservation.\n          - Rework START_SERVER.bat to verify permissions once, start server, then test health.\n          - Handle localized Windows netsh output without false failure.\n          - Extend diagnostics with network profile and LAN repair logs.\n          - Dedicated FIX_FIREWALL_AND_LAN.bat one-click administrator repair for port 300.\n          - Fix Windows netsh reporting blank URL reservation as success.\n          - Verify HTTP URL ACL and scoped Private LocalSubnet firewall rule on each launch.\n          - Restore port 300 and accept connections from other devices on the same local network.\n          - Preserve loopback-only smoke test on hosted Windows runners with pre-reserved wildcard HTTP URLs.\n          - First-run Windows administrator setup reserves HTTP URL and opens TCP 300 for Private LocalSubnet only.\n          - Show LAN IP and firewall diagnostics; preserve patient data, print settings and two sheet alignments.\n          - Update startup, diagnostics, watchdog, backup locking and HTTP permission setup consistently.\n          - Fix Windows HTTP Access is denied with one-time administrator URL ACL setup.\n          - START_SERVER.bat offers permission repair automatically if Windows blocks startup.\n          - Fix Windows local server startup and HTTP request handling.\n          - Validate real Windows server startup and health/bookings/backups/settings APIs in CI.\n          - Independent second-sheet horizontal and vertical patient-field alignment, preserving the first sheet exactly.\n          - Additional day, month, year and date-height adjustments to position the date inside printed separators.\n          - Second-sheet calibration is stored in local settings and synchronized with the local server.\n          - Two synchronized patient-sheet previews based on the original PDF template.\n          - Existing data-only printing calibration is preserved and alignment controls are hidden.\n          - Search and filter bookings in a separate window, select a booking and update its saved data.\n          - Daily snapshots of bookings and print settings in the program Backups folder, plus an in-app restore button.\n          - Server stores bookings and settings in the program Data folder.\n          - Additional independent image-only horizontal and vertical adjustment remains available.\n          - Live preview shows image-only offsets.
          - Preserve the existing calibrated patient-data positions used for printing on preprinted sheets.
          - Save and restore the separate template offsets with printer calibration profiles.
          - Local server, startup scripts and daily backup scripts included.
          - Fresh empty data files; no patient records or backups included.

          Extract ZIP and run START_SERVER.bat on Windows. Verify print alignment on your own printer with A4 at 100% scale. Automated checks verify required files and PowerShell syntax, not physical printing.
          '@
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag PET_CT_SHEET_Portable_v2.9.3.zip --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          } else {
            gh release create $tag PET_CT_SHEET_Portable_v2.9.3.zip --target "$env:GITHUB_SHA" --title 'PET CT SHEET v2.9.3 - Portable Windows' --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; check Actions workflow permissions' }
          }
