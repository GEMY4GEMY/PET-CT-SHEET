name: Publish PET CT SHEET Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application and PowerShell syntax
        shell: pwsh
        run: |
          $required = @('index.html','Server.ps1','START_SERVER.bat','ENABLE_AUTOSTART.bat','DAILY_BACKUP.ps1','DAILY_BACKUP.bat','INSTALL_AUTOSTART.ps1','RUN_SERVER_LOGGED.ps1','DIAGNOSE_SERVER.bat','FIX_FIREWALL_AND_LAN.bat','SETUP_LAN_FIREWALL.ps1','Watchdog.ps1')
          foreach ($f in $required) { if (!(Test-Path $f)) { throw "Missing source: $f" } }
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $($_.Name): $($errors | Out-String)" }
          }
      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path PET_CT_SHEET | Out-Null
          Copy-Item index.html,*.ps1,*.bat PET_CT_SHEET/
          foreach ($dir in @('Data','Backups','Logs')) { New-Item -ItemType Directory -Force -Path "PET_CT_SHEET/$dir" | Out-Null }
          Set-Content -Encoding UTF8 -Path PET_CT_SHEET/Data/bookings.json -Value '[]'
          Set-Content -Encoding UTF8 -Path PET_CT_SHEET/Data/settings.json -Value '{}'
          Compress-Archive -Path PET_CT_SHEET -DestinationPath PET_CT_SHEET_Portable_v3.1.0.zip -Force
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v3.1.0'
          $notes = @'
          PET CT SHEET v3.1.0 - TCP 500 Windows portable server.\n\n          - Port migrated to 500 across startup, server, watchdog, diagnostics and firewall.\n          - Fixed CMD startup wait loop and separate old port 300 from the new server.\n          - Windows startup, bookings and settings API checks included.

          - Fix HTTP response CRLF formatting; Windows server and API smoke test now pass.\n          - Completely replace the HTTP.sys HttpListener server with a raw .NET TCP HTTP server.
          - No URL reservations, netsh URLACL, or administrator rights needed to start on the main PC.
          - Retain port 500 and all existing bookings, settings, backup, restore, import and update endpoints.
          - Remove obsolete URLACL repair and validation files.
          - Separate optional one-time Windows Firewall setup for Private LocalSubnet devices.
          - Simplify startup and diagnostics. No patient data or printing changes.
          - Keep previous version Data and Backups folders when upgrading.

          Extract ZIP and run START_SERVER.bat. For LAN access run FIX_FIREWALL_AND_LAN.bat once as administrator.
          '@
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag PET_CT_SHEET_Portable_v3.1.0.zip --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          } else {
            gh release create $tag PET_CT_SHEET_Portable_v3.1.0.zip --target "$env:GITHUB_SHA" --title 'PET CT SHEET v3.1.0 - Portable Windows' --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; check Actions workflow permissions' }
          }
