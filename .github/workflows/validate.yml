name: Validate PET CT SHEET source
on:
  push:
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required application files
        shell: pwsh
        run: |
          $required = @('index.html','Server.ps1','START_SERVER.bat','DAILY_BACKUP.ps1','INSTALL_AUTOSTART.ps1')
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing application file: $file" }
          }
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { foreach ($err in $errors) { Write-Host ('SYNTAX FILE: ' + $_.Name + ' LINE: ' + $err.Extent.StartLineNumber + ' MESSAGE: ' + $err.Message) }; exit 1 }
          }
      - name: Validate embedded browser JavaScript syntax
        shell: pwsh
        run: |
          $html = [IO.File]::ReadAllText((Join-Path (Get-Location) 'index.html'))
          $matches = [regex]::Matches($html, '(?s)<script(?:\\s[^>]*)?>(.*?)</script>')
          if ($matches.Count -eq 0) { throw 'Missing browser JavaScript' }
          $js = ($matches | ForEach-Object { $_.Groups[1].Value }) -join "`n"
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'browser-check.js'), $js)
          node --check browser-check.js
          if ($LASTEXITCODE -ne 0) { throw 'Browser JavaScript syntax invalid' }
      - name: Windows server startup and API smoke test
        shell: pwsh
        run: |
          $env:PET_CT_SHEET_LISTEN_PREFIX='http://127.0.0.1:300/'
          $proc = Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File', (Join-Path (Get-Location) 'Server.ps1')) -PassThru -RedirectStandardOutput 'server-smoke-out.log' -RedirectStandardError 'server-smoke-error.log'
          try {
            $ready = $false
            for ($i=0; $i -lt 25; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try { $health = Invoke-RestMethod 'http://127.0.0.1:300/api/health' -TimeoutSec 2; if ($health.ok) { $ready=$true; break } } catch {}
            }
            if (-not $ready) { Get-Content 'server-smoke-out.log' -ErrorAction SilentlyContinue; Get-Content 'server-smoke-error.log' -ErrorAction SilentlyContinue; throw 'Server failed to start on Windows' }
            $bookings=Invoke-RestMethod 'http://127.0.0.1:300/api/bookings' -TimeoutSec 5
            $backups=Invoke-RestMethod 'http://127.0.0.1:300/api/backups' -TimeoutSec 5
            $settings=Invoke-RestMethod 'http://127.0.0.1:300/api/settings' -TimeoutSec 5
            $newSettings = '{"printer":"test","calibration":{"x":1}}'
          $null=Invoke-RestMethod 'http://127.0.0.1:300/api/settings' -Method POST -Body $newSettings -ContentType 'application/json' -TimeoutSec 5
          $readSettings=Invoke-RestMethod 'http://127.0.0.1:300/api/settings' -TimeoutSec 5
          if($readSettings.printer -ne 'test'){throw 'Settings POST/GET failed'}
          $newBooking = '{"id":"test","d":{"name":"Test Patient","phone":"01012345678","date":"2026-10-26"}}'
          $null=Invoke-RestMethod 'http://127.0.0.1:300/api/bookings' -Method POST -Body $newBooking -ContentType 'application/json' -TimeoutSec 5
          $readBookings=Invoke-RestMethod 'http://127.0.0.1:300/api/bookings' -TimeoutSec 5
          if(@($readBookings).Count -lt 1){throw 'Booking POST/GET failed'}
          Write-Host 'Server startup, GET APIs, settings POST and booking POST OK'
          } finally { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force } }
